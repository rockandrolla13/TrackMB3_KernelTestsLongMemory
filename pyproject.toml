[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kmem"
version = "0.2.0"
description = "Kernel tests under long memory: generators, memory kernels, calibration rules and experiment runner"
readme = "README.md"
# Exact reproduction of the saved EXP2-EXP7 rows was verified on Python 3.12.13 with these exact pins.
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==2.5.1",
    "scipy==1.17.1",
    "pydantic==2.12.5",  # `python -m kmem` loads it from the user site; `python -I` sees 2.8.2. Any 2.x works.
    "typer==0.17.4",
]

[project.optional-dependencies]
analysis = ["pandas==2.2.3", "statsmodels==0.14.6", "matplotlib==3.10.8"]
dev = ["pytest==7.4.4"]

[tool.setuptools.packages.find]
include = ["kmem*"]
